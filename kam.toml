updateJson = "https://raw.githubusercontent.com/RyanRaw/MagicNet-Mod/main/update.json"
metamodule = false

[mmrl.repo]
license = "MIT"
license_file = "LICENSE"
homepage = "https://github.com/RyanRaw/MagicNet-Mod"
readme = "https://github.com/RyanRaw/MagicNet-Mod/blob/main/README.md"
readme_file = "README.md"
changelog = "https://github.com/RyanRaw/MagicNet-Mod/blob/main/docs/releases/v1.8.0.md"
changelog_file = "docs/releases/v1.8.0.md"
screenshots = []
categories = ["tools"]
keywords = [
    "kam",
    "module",
    "android",
    "template",
]
maintainers = []
repository = "https://github.com/RyanRaw/MagicNet-Mod"
documentation = ""
issues = "https://github.com/RyanRaw/MagicNet-Mod/issues"
funding = "https://github.com/sponsors/LIghtJUNction"
support = ""
donate = ""
cover = ""
icon = "icon.png"
devices = []
arch = ["arm64-v8a"]
require = []
antifeatures = []
max_num = 0
min_api = 21
max_api = 36
verified = false
features = [
    "module-template",
    "customization",
]

[mmrl.repo.note]
title = ""
message = ""

[mmrl.repo.manager.magisk]
devices = []
arch = []
require = []

[mmrl.repo.manager.kernelsu]
devices = []
arch = []
require = []

[mmrl.repo.manager.apatch]
devices = []
arch = []
require = []

[mmrl.repo.options.archive]
compression = ""

[kam]
min_api = 0
max_api = 0
supported_arch = []
conflicts = []
module_type = "kam"

[kam.build]
target_dir = "dist"
output_file = "{{id}}"
hooks_dir = "hooks"

[kam.workspace]
members = ["."]

[dev.sync]
stage_dir = "/sdcard/Download/MagicNet/kam-dev/{{id}}"
mirror = ["webroot/**"]
preserve = [
    ".config/**",
    "config.yaml",
    "config.yml",
    "subscriptions/**",
    "*.user.yaml",
    "*.user.yml",
]
ignore = [
    "logs/**",
    ".log/**",
    "cache/**",
    "*.bak",
    "*.kam-tmp",
]

